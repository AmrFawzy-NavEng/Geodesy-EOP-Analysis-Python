[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesy-eop"
version = "0.1.0"
description = "Earth Orientation Parameter (EOP) retrieval, analysis, and visualization."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Amr Fawzy"}]
keywords = ["geodesy", "eop", "earth-orientation", "iers", "polar-motion", "ut1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "requests>=2.28",
    "matplotlib>=3.5",
]

[project.urls]
Repository = "https://github.com/AmrFawzy-NavEng/Geodesy-EOP-Analysis-Python"
